name: IPQ60XX 360V6 NSS 固件编译

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: 基础环境准备
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential gcc g++ binutils bzip2 flex python3 python3-pip \
            perl make cmake autoconf automake libtool libssl-dev libcurl4-openssl-dev \
            libncurses-dev zlib1g-dev gawk git gettext libsigsegv-dev \
            wget unzip patch bc rsync subversion libxml2-utils

      - name: 缓存 OpenWrt 编译目录
        uses: actions/cache@v4
        with:
          path: |
            openwrt
            !openwrt/.git
            !openwrt/build_dir
            !openwrt/bin
            !openwrt/staging_dir
          key: ${{ runner.os }}-ipq60xx-${{ hashFiles('**/configs/IPQ60XX.config') }}
          restore-keys: |
            ${{ runner.os }}-ipq60xx-

      - name: 克隆 LibWrt 源码（laipeng668 main-nss）
        run: |
          git clone --depth 1 --branch main-nss https://github.com/laipeng668/openwrt-6.x openwrt
          cd openwrt
          git apply ../scripts/*.patch 2>/dev/null || true

      - name: 复制配置文件
        run: |
          cp -vf configs/General.config openwrt/.config
          cp -vf configs/IPQ60XX.config openwrt/.config
          cp -vf scripts/Roc-script.sh openwrt/
          chmod +x openwrt/Roc-script.sh

      - name: 执行自定义脚本
        run: |
          cd openwrt
          ./Roc-script.sh

      - name: 下载依赖包
        run: |
          cd openwrt
          make defconfig
          make download -j$(nproc)

      - name: 编译固件（多线程）
        run: |
          cd openwrt
          make -j$(nproc) V=s

      - name: 整理固件产物
        run: |
          mkdir -p output
          cp -vf openwrt/bin/targets/qualcommax/ipq60xx/*.bin output/
          cp -vf openwrt/bin/targets/qualcommax/ipq60xx/*.ubi output/
          ls -lh output/

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            output/*.bin
            output/*.ubi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
