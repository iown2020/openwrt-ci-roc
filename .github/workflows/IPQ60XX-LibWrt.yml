name: 360V6 NSS 优化固件
on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/laipeng668/openwrt-6.x.git
  REPO_BRANCH: main-nss
  CONFIG_FILE: configs/IPQ60XX.config
  GENERAL_CONFIG_FILE: configs/General.config
  DIY_SCRIPT: scripts/Roc-script.sh
  TZ: Asia/Shanghai
  FIRMWARE_TAG: 360V6-NSS

jobs:
  Build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: 初始化编译环境
      run: |
        sudo apt update > /dev/null 2>&1
        sudo apt install -y build-essential ccache git libssl-dev python3 python3-pip unzip bzip2 wget gawk flex bison libncurses-dev zlib1g-dev

    - name: 检出仓库代码
      uses: actions/checkout@v4

    - name: 拉取 OpenWrt 源码
      run: |
        sudo mkdir -p /mnt/openwrt
        sudo chown -R $(id -u):$(id -g) /mnt/openwrt
        git clone --depth 1 -b $REPO_BRANCH $REPO_URL /mnt/openwrt
        cd /mnt/openwrt
        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV

    - name: 复制配置与脚本
      run: |
        cp $GITHUB_WORKSPACE/$GENERAL_CONFIG_FILE $OPENWRT_PATH/.config
        cp $GITHUB_WORKSPACE/$CONFIG_FILE $OPENWRT_PATH/.config
        cp $GITHUB_WORKSPACE/$DIY_SCRIPT $OPENWRT_PATH/
        chmod +x $OPENWRT_PATH/Roc-script.sh

    - name: 执行综合优化脚本
      run: |
        cd $OPENWRT_PATH
        ./Roc-script.sh

    - name: 下载编译依赖
      run: |
        cd $OPENWRT_PATH
        make download -j$(nproc)

    - name: 编译固件
      run: |
        cd $OPENWRT_PATH
        make -j$(nproc) || make -j1 V=s

    - name: 清理冗余文件
      run: |
        cd $OPENWRT_PATH/bin/targets/qualcommax/ipq60xx
        rm -rf packages feeds.buildinfo version.buildinfo sha256sums profiles.json
        echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV

    - name: 上传固件到 Release
      uses: ncipollo/release-action@v1
      with:
        name: 360V6 NSS 优化固件
        allowUpdates: true
        tag: ${{ env.FIRMWARE_TAG }}
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: ${{ env.FIRMWARE_PATH }}/*
